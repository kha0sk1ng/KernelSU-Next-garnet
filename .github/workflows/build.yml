name: Build PureKernel Lite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          path: AnyKernel3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 libssl-dev flex bison bc make libelf-dev binutils-aarch64-linux-gnu

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ runner.os }}-clang-r416183b

      - name: Download clang-r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang

      - name: Setup Clang Path
        run: echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.10-2025-06 kernel

      - name: Apply KernelSU-Next (pershoot/dev-susfs)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Apply SuSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10
          cd susfs4ksu && git checkout 86114db0c49f20fa7857b8b559f3ab87cbc2d00d && cd ..
          cd kernel
          find ../susfs4ksu -type f -name "susfs.c" -exec cp {} fs/ \;
          find ../susfs4ksu -type f -name "susfs.h" -exec cp {} include/linux/ \;
          find ../susfs4ksu -type f -name "susfs_def.h" -exec cp {} include/linux/ \;
          patch -p1 -F 3 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

      - name: Configure kernel (Lite)
        run: |
          cd kernel
          cat >> arch/arm64/configs/gki_defconfig << 'EOF_CONF'

          # PureKernel Optimizations
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_MQ_IOSCHED_KYBER=y

          # SuSFS
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y

          EOF_CONF

          ./scripts/config --file arch/arm64/configs/gki_defconfig -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out

      - name: Package zip
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 ../PureKernel-Lite-garnet-${VERSION}.zip . -x "*.zip" -x ".git*" -x "README.md" -x "*placeholder"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: PureKernel-Lite-garnet-*.zip
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
