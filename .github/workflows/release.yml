name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive release version
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="KernelSU-Next-SuSFS-garnet-${TAG}.zip"
          ASSET_NAME="PureKernel-KSUNext-SuSFS-garnet-${TAG}.zip"
          zip -r9 "${ZIP_NAME}" . -x "*.zip" -x ".git*" -x "README.md" -x "*placeholder"
          mv "${ZIP_NAME}" "${ASSET_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PureKernel ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: PureKernel-KSUNext-SuSFS-garnet-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
